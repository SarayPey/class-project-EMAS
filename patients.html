<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, initial-scale=1.0'>
		<title>Document</title>
		<link rel='stylesheet' href='style.css'>
	</head>
	<body>
		<header>Management system</header>
		<main>
			<section id='options'>
				<h1 id = 'optH'>Options</h1>
				<a href='#' id='patC'>Create a patient</a>
				<a href='index.html'>Back to main menu</a>
			</section>
			<section>
				<h1>Patients</h1>
				<div id='patShow'></div>
			</section>
			<dialog id='patForm'>
				<form id='patName'>
					<label for='namP'>Patient Name</label>
					<input type='text' name='namP' id='namP' required>
				</form>
				<form id='patAge'>
					<label for='age'>Age</label>
					<input type="number" name='age' id='age' required>
				</form>
				<form id='patNum'>
					<label for='numP'>Phone number</label>
					<input type='text' name='numP' id='numP' required>
				</form>
				<form id='patAddress'>
					<label for='add'>Address</label>
					<input type='text' name='add' id='add' required>
				</form>
				<button id='btnClose'>Close</button>
				<button type='submit' id='btnSubmit'>Create</button>
			</dialog>
		</main>
		<footer>Hospital []&copy; — All rights reserved.</footer>
	</body>
	<script type='module' src='script.js'></script>
</html>
