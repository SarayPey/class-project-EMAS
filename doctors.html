<!DOCTYPE html>
<html lang='en'>
	<head>
		<meta charset='UTF-8'>
		<meta name='viewport' content='width=device-width, initial-scale=1.0'>
		<title>Document</title>
		<link rel='stylesheet' href='style.css'>
	</head>
	<body>
		<header>Management system</header>
		<main>
			<section id='options'>
				<h1 id = 'optH'>Options</h1>
				<a href='#' id='docC'>Create a doctor</a>
				<a href='index.html'>Back to main menu</a>
			</section>
			<section>
				<h1>Doctors</h1>
				<div id='docShow'></div>
			</section>
			<dialog id='docForm'>
				<form id='docName'>
					<label for='namD'>Doctor name</label>
					<input type="text" name='namD' id='namD'>
				</form>
				<form id='docSpec'>
					<label for='spe'>Specialty</label>
					<select name='spe id='spe' required>
						<option selected disabled>-- Choose a specialty --</option>
					</select>
				</form>
				<form id='docNum'>
					<label for='nuD'>Phone number</label>
					<input type='text' name='nuD' id='nuD' required>
				</form>
				<button id='btnClose'>Close</button>
				<button type='submit' id='btnSubmit'>Create</button>
			</dialog>
		</main>
		<footer>Hospital []&copy; — All rights reserved.</footer>
	</body>
	<script type='module' src='./script.js'></script>
</html>
